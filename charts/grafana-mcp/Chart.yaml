apiVersion: v2
name: grafana-mcp
description: Model Context Protocol (MCP) server for Grafana with integrated OAuth 2.1 proxy sidecar and secure Valkey session storage.
type: application
version: 0.1.1
appVersion: "v0.1.1"
kubeVersion: ">=1.25.0-0"
home: https://github.com/devopssavvy/grafana-mcp-oauth
icon: https://artifacthub.io/image/b4fed1a7-6c8f-4945-b99d-096efa3e4116
sources:
  - https://github.com/devopssavvy/grafana-mcp-oauth
  - https://github.com/grafana/mcp-grafana
  - https://valkey.io/valkey-helm/
maintainers:
  - name: DevOpsSavvy
    url: https://github.com/devopssavvy
dependencies:
  - name: valkey
    version: "1.0.0"
    repository: "https://valkey.io/valkey-helm/"
    condition: valkey.enabled
