{{/* Secret for Valkey / Redis Authentication */}}
{{- if and (or .Values.valkey.enabled .Values.redis.createSecret) (not .Values.redis.existingSecret) }}
{{- $password := include "grafana-mcp.valkeyPassword" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana-mcp.redisSecretName" . }}
  namespace: {{ include "grafana-mcp.namespace" . }}
  labels:
    {{- include "grafana-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-store
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
  default: {{ $password | b64enc | quote }}
{{- end }}
---
{{/* Secret for Valkey / Redis TLS / mTLS Certificates */}}
{{- if and .Values.redis.tls.enabled (not .Values.redis.tls.existingSecret) }}
{{- $secretName := include "grafana-mcp.tlsSecretName" . }}
{{- $existingSecret := lookup "v1" "Secret" (include "grafana-mcp.namespace" .) $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "grafana-mcp.namespace" . }}
  labels:
    {{- include "grafana-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-store
type: kubernetes.io/tls
data:
  {{- if and $existingSecret (hasKey $existingSecret.data "ca.crt") }}
  ca.crt: {{ index $existingSecret.data "ca.crt" }}
  tls.crt: {{ index $existingSecret.data "tls.crt" }}
  tls.key: {{ index $existingSecret.data "tls.key" }}
  server.crt: {{ index $existingSecret.data "server.crt" }}
  server.key: {{ index $existingSecret.data "server.key" }}
  client.crt: {{ index $existingSecret.data "client.crt" }}
  client.key: {{ index $existingSecret.data "client.key" }}
  {{- else }}
  {{- $ca := genCA "valkey-ca" 3650 }}
  {{- $valkeyHost := printf "%s-valkey" .Release.Name }}
  {{- $valkeyFullHost := printf "%s.%s.svc.%s" $valkeyHost (include "grafana-mcp.namespace" .) .Values.clusterDomain }}
  {{- $serverCert := genSignedCert $valkeyHost nil (list $valkeyHost $valkeyFullHost "localhost" "127.0.0.1") 3650 $ca }}
  {{- $clientCert := genSignedCert "mcp-oauth-proxy" nil (list "mcp-oauth-proxy" "localhost") 3650 $ca }}
  ca.crt: {{ $ca.Cert | b64enc | quote }}
  tls.crt: {{ $serverCert.Cert | b64enc | quote }}
  tls.key: {{ $serverCert.Key | b64enc | quote }}
  server.crt: {{ $serverCert.Cert | b64enc | quote }}
  server.key: {{ $serverCert.Key | b64enc | quote }}
  client.crt: {{ $clientCert.Cert | b64enc | quote }}
  client.key: {{ $clientCert.Key | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{/* Optional Master Encryption Secret (Only created if masterSecret is explicitly provided) */}}
{{- if and .Values.oauthProxy.masterSecret (not .Values.oauthProxy.masterSecretSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana-mcp.fullname" . }}-master-secret
  namespace: {{ include "grafana-mcp.namespace" . }}
  labels:
    {{- include "grafana-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  master-secret: {{ .Values.oauthProxy.masterSecret | b64enc | quote }}
{{- end }}
