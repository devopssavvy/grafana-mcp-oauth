{{- if and .Values.networkPolicy.enabled .Values.valkey.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grafana-mcp.fullname" . }}-valkey-access
  namespace: {{ include "grafana-mcp.namespace" . }}
  labels:
    {{- include "grafana-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-store
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # Allow ingress from grafana-mcp proxy pods
    - from:
        - podSelector:
            matchLabels:
              {{- include "grafana-mcp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: mcp-server
      ports:
        - protocol: TCP
          port: 6379
    # Allow inter-node replication and sentinel peering for Valkey pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grafana-mcp.fullname" . }}-mcp-access
  namespace: {{ include "grafana-mcp.namespace" . }}
  labels:
    {{- include "grafana-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  podSelector:
    matchLabels:
      {{- include "grafana-mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow connection to Valkey session store
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 6379
    # Allow connection to Grafana backend and other configured endpoints
    - {}
{{- end }}
