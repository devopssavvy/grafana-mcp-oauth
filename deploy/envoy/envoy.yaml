admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
  - name: main_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          normalize_path: true
          merge_slashes: true
          route_config:
            name: main_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              # 1. RFC 9728 & RFC 8414 MCP Discovery endpoints (NO ext_authz)
              - match:
                  prefix: "/.well-known/"
                route:
                  cluster: mcp_auth_helper_http
                  timeout: 10s
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true

              # 2. Public OAuth login, callback, and token endpoints (NO ext_authz)
              - match:
                  path: "/mcp/auth"
                route:
                  cluster: mcp_auth_helper_http
                  timeout: 30s
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - match:
                  prefix: "/mcp/auth/"
                route:
                  cluster: mcp_auth_helper_http
                  timeout: 30s
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true

              # 3. Remote MCP endpoint (Protected by ext_authz -> forwards to stock mcp-grafana)
              - match:
                  path: "/mcp"
                route:
                  cluster: mcp_grafana
                  timeout: 0s # Disabled timeout for long-lived SSE/Streaming connections
                  idle_timeout: 300s
                # ext_authz is enabled by default from the HTTP filter list
              - match:
                  prefix: "/mcp/"
                route:
                  cluster: mcp_grafana
                  timeout: 0s # Disabled timeout for long-lived SSE/Streaming connections
                  idle_timeout: 300s
                # ext_authz is enabled by default from the HTTP filter list

              # 4. Regular Grafana Web User Traffic (Transparent pass-through, NO ext_authz)
              - match:
                  prefix: "/"
                route:
                  cluster: grafana_server
                  timeout: 60s
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true

          http_filters:
          # Global ext_authz filter configured via gRPC over HTTP/2
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              grpc_service:
                envoy_grpc:
                  cluster_name: mcp_auth_helper_grpc
                timeout: 1.5s
              transport_api_version: V3
              clear_route_cache: true
              status_on_error:
                code: ServiceUnavailable
              failure_mode_allow: false

          # Standard router filter
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # gRPC ext_authz backend (HTTP/2 enabled)
  - name: mcp_auth_helper_grpc
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: mcp_auth_helper_grpc
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: mcp-auth-helper
                port_value: 9001

  # HTTP OAuth handler backend
  - name: mcp_auth_helper_http
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: mcp_auth_helper_http
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: mcp-auth-helper
                port_value: 8081

  # Upstream stock mcp-grafana service
  - name: mcp_grafana
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: mcp_grafana
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: mcp-grafana
                port_value: 8000

  # Grafana Server
  - name: grafana_server
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: grafana_server
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: grafana
                port_value: 3000
