apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-grafana-gateway
  namespace: grafana
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
# 1. Route for RFC 9728 Discovery & Public OAuth Endpoints (no auth required)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-auth-route
  namespace: grafana
spec:
  parentRefs:
  - name: mcp-grafana-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /.well-known/
    - path:
        type: Exact
        value: /mcp/auth
    - path:
        type: PathPrefix
        value: /mcp/auth/
    backendRefs:
    - name: mcp-auth-helper
      port: 8081
---
# 2. Route for Remote MCP Tools (Protected by Envoy Gateway SecurityPolicy)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-tools-route
  namespace: grafana
spec:
  parentRefs:
  - name: mcp-grafana-gateway
  rules:
  - matches:
    - path:
        type: Exact
        value: /mcp
    - path:
        type: PathPrefix
        value: /mcp/
    backendRefs:
    - name: mcp-grafana
      port: 8000
---
# SecurityPolicy attaching ext_authz to the /mcp HTTPRoute
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mcp-ext-authz-policy
  namespace: grafana
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mcp-tools-route
  extAuth:
    grpc:
      backendRefs:
      - name: mcp-auth-helper
        port: 9001
---
# 3. Transparent Route for Regular Grafana Web Traffic
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-web-route
  namespace: grafana
spec:
  parentRefs:
  - name: mcp-grafana-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: grafana
      port: 3000
