version: '3.8'

services:
  # 1. Direct Go OAuth Proxy (Front-door for agents)
  mcp-proxy:
    image: grafana-mcp-oauth:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mcp-proxy
    ports:
      - "8080:8080"
    environment:
      - MODE=proxy
      - PORT=8080
      - BASE_URL=http://localhost:8080
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_PUBLIC_URL=http://localhost:3000
      - TARGET_MCP_URL=http://mcp-grafana:8000
      - REDIS_ADDR=redis:6379
      - MCP_MASTER_SECRET=${MCP_MASTER_SECRET:-}
    depends_on:
      - redis
      - mcp-grafana

  # 2. Stock Upstream mcp-grafana (100% Zero-Fork)
  mcp-grafana:
    image: grafana/mcp-grafana:latest
    container_name: upstream-mcp-grafana
    command: ["--base-path", "/mcp"]
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_FORWARD_HEADERS=Cookie
    expose:
      - "8000"

  # 3. Redis for Zero-Knowledge encrypted session mapping
  redis:
    image: redis:7-alpine
    container_name: mcp-redis-store
    command: redis-server --appendonly yes
    expose:
      - "6379"
