name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Race Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Unit & Integration Tests
        run: |
          go test -v -count=1 -race ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Validate Container Build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: grafana-mcp-oauth:test
          cache-from: type=gha,scope=buildx-ci
          cache-to: type=gha,mode=max,scope=buildx-ci

  helm-test:
    name: Helm Chart Lint & KinD Mock Cluster Deployment Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.17.1

      - name: Add Helm Repositories
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update

      - name: Build Chart Dependencies
        run: |
          helm dependency build charts/grafana-mcp

      - name: Lint Helm Chart
        run: |
          helm lint charts/grafana-mcp

      - name: Create KinD Mock Kubernetes Cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: kind-mock-k8s

      - name: Build & Load Container Images into KinD
        run: |
          docker build -t ghcr.io/devopssavvy/grafana-mcp-oauth:ci-test -f ./Dockerfile .
          docker pull grafana/mcp-grafana:2.3.0
          docker pull valkey/valkey:9.1.3
          kind load docker-image ghcr.io/devopssavvy/grafana-mcp-oauth:ci-test --name kind-mock-k8s
          kind load docker-image grafana/mcp-grafana:2.3.0 --name kind-mock-k8s
          kind load docker-image valkey/valkey:9.1.3 --name kind-mock-k8s

      - name: Deploy Chart to Mock Cluster
        run: |
          helm install test-release charts/grafana-mcp \
            --namespace default \
            --set image.repository="ghcr.io/devopssavvy/grafana-mcp-oauth" \
            --set image.tag="ci-test" \
            --set image.pullPolicy="Never" \
            --set oauthProxy.baseUrl="http://localhost:8080" \
            --set grafana.url="http://grafana:3000" \
            --wait --timeout 300s

      - name: Debug Kubernetes Resources on Failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/name=grafana-mcp -c mcp-oauth-proxy || true
          kubectl logs -l app.kubernetes.io/name=grafana-mcp -c mcp-grafana || true
          kubectl logs -l app.kubernetes.io/name=valkey --all-containers=true || true
          kubectl get events -A --sort-by='.metadata.creationTimestamp' || true

      - name: Verify Kubernetes Resources
        if: success()
        run: |
          kubectl get pods,svc,secrets,networkpolicy -o wide
          kubectl get deployment test-release-grafana-mcp
