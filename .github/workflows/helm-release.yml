name: Release Helm Chart (OCI)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override Helm chart version (SemVer, e.g. 0.1.0)'
        required: false
        type: string
        default: ''

concurrency:
  group: helm-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release-chart:
    name: Package & Publish Helm Chart to GHCR OCI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.17.1

      - name: Add Helm Repositories
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update

      - name: Build Chart Dependencies
        run: |
          helm dependency build charts/grafana-mcp

      - name: Determine Chart Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            CHART_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            CHART_VERSION="${GITHUB_REF_NAME#v}"
          else
            CHART_VERSION="0.1.0-dev.${{ github.run_number }}"
          fi
          echo "CHART_VERSION=${CHART_VERSION}" >> $GITHUB_OUTPUT
          echo "Building Helm chart version ${CHART_VERSION}"

      - name: Lint Helm Chart
        run: |
          helm lint charts/grafana-mcp

      - name: Package Helm Chart
        run: |
          mkdir -p .cr-release-packages
          helm package charts/grafana-mcp \
            --version "${{ steps.version.outputs.CHART_VERSION }}" \
            --app-version "v${{ steps.version.outputs.CHART_VERSION }}" \
            --destination .cr-release-packages

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username "${{ github.actor }}" --password-stdin

      - name: Publish Chart to OCI Registry
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push ".cr-release-packages/grafana-mcp-${{ steps.version.outputs.CHART_VERSION }}.tgz" "oci://${{ env.REGISTRY }}/${OWNER_LOWER}/charts"
