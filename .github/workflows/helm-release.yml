name: Release Helm Chart (OCI)

on:
  push:
    branches:
      - main
    paths:
      - 'charts/grafana-mcp/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override Helm chart version (SemVer, e.g. 0.1.2)'
        required: false
        type: string
        default: ''

concurrency:
  group: helm-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release-chart:
    name: Package & Publish Helm Chart to GHCR OCI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.17.1

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username "${{ github.actor }}" --password-stdin

      - name: Inspect Chart Version & Check Registry
        id: check
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          CHART_NAME="grafana-mcp"
          CHART_DIR="charts/${CHART_NAME}"
          
          # Read versions directly from Chart.yaml as single source of truth
          YAML_VERSION=$(grep '^version:' "${CHART_DIR}/Chart.yaml" | awk '{print $2}' | tr -d '"'\''')
          YAML_APP_VERSION=$(grep '^appVersion:' "${CHART_DIR}/Chart.yaml" | awk '{print $2}' | tr -d '"'\''')
          
          if [ -n "${{ github.event.inputs.version }}" ]; then
            CHART_VERSION="${{ github.event.inputs.version }}"
          else
            CHART_VERSION="${YAML_VERSION}"
          fi
          
          echo "chart_version=${CHART_VERSION}" >> $GITHUB_OUTPUT
          echo "app_version=${YAML_APP_VERSION}" >> $GITHUB_OUTPUT
          echo "owner_lower=${OWNER_LOWER}" >> $GITHUB_OUTPUT
          
          echo "Evaluating release for chart '${CHART_NAME}' version '${CHART_VERSION}' (appVersion '${YAML_APP_VERSION}')..."
          
          # Check if this exact chart version is already published in GHCR OCI
          if helm show chart "oci://${{ env.REGISTRY }}/${OWNER_LOWER}/charts/${CHART_NAME}" --version "${CHART_VERSION}" >/dev/null 2>&1; then
            echo "Chart version ${CHART_VERSION} is already published in OCI registry. Skipping release."
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "Chart version ${CHART_VERSION} not found in OCI registry. Proceeding with release."
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Add Helm Repositories
        if: steps.check.outputs.published == 'false'
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update

      - name: Build Chart Dependencies
        if: steps.check.outputs.published == 'false'
        run: |
          helm dependency build charts/grafana-mcp

      - name: Lint Helm Chart
        if: steps.check.outputs.published == 'false'
        run: |
          helm lint charts/grafana-mcp

      - name: Package Helm Chart
        if: steps.check.outputs.published == 'false'
        run: |
          mkdir -p .cr-release-packages
          # Package preserving Chart.yaml appVersion (or override version if specified in inputs)
          helm package charts/grafana-mcp \
            --version "${{ steps.check.outputs.chart_version }}" \
            --destination .cr-release-packages

      - name: Publish Chart to OCI Registry
        if: steps.check.outputs.published == 'false'
        run: |
          helm push ".cr-release-packages/grafana-mcp-${{ steps.check.outputs.chart_version }}.tgz" "oci://${{ env.REGISTRY }}/${{ steps.check.outputs.owner_lower }}/charts"

      - name: Create and Push Git Tag
        if: steps.check.outputs.published == 'false' && github.event_name == 'push'
        run: |
          TAG_NAME="chart-v${{ steps.check.outputs.chart_version }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Git tag ${TAG_NAME} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release Helm chart ${{ steps.check.outputs.chart_version }} (appVersion ${{ steps.check.outputs.app_version }})"
            git push origin "$TAG_NAME"
            echo "Successfully tagged and pushed ${TAG_NAME}"
          fi
